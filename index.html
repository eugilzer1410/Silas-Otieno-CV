
<!DOCTYPE html>
<html>
<head>
    <title>Silas Otieno CV</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background-image:
                linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                url("otieno.jpeg");

            background-size: cover;
            background-position: center 25%;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        header {
            background: rgba(0,0,0,0.65);
            padding: 25px;
            text-align: center;
        }

        header h1 {
            color: white;
            font-size: 32px;
            margin: 0;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 25px;
            background: rgba(0,0,0,0.45);
        }

        nav a {
            background: #4CAF50;
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 7px;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            background: white;
            color: black;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            nav {
                gap: 10px;
            }

            nav a {
                padding: 11px 15px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>SILAS OTIENO CV</h1>
    </header>

    <nav>
        <a href="About me.html">About Me</a>
        <a href="work experience.html">Work Experience</a>
        <a href="education.html">Education</a>
        <a href="contact me.html">Contact</a>
        <a href="skills.html">Skills</a>
        <a href="table and form.HTML">Table and Form</a>
    </nav>

</body>
</html>
